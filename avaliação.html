<!DOCTYPE html>
<html lang="pt">
<div class="top-bar">AVALIAÇÃO REMUNERADA</div>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliação</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>

    <div class="container">
        <h1><span id="saldo">Saldo: R$ <span id="valorSaldo">0,00</span></span></h1>

            <div class="brand">
                <img src="images/logo1.png" alt="APPLE" class="brand-logo">
                <p>APPLE</p>

                    <img src="images/estrela_vazia.png" class="star" data-value="1">

                    <img src="images/estrela_vazia.png" class="star" data-value="3">
                    <img src="images/estrela_vazia.png" class="star" data-value="4">
                    <img src="images/estrela_vazia.png" class="star" data-value="5">
                </div>
                <div class="opinion-container hidden">
                    <label for="opinion-0">Qual sua opinião?</label>
                    <textarea id="opinion-0" rows="3" placeholder="Escreva sua opinião..."></textarea>
                </div>
            </div>

            <!-- Marca 2 -->
            <div class="brand">
                <img src="images/logo2.png" alt="XIAOMI" class="brand-logo">

            </div>

    <footer class="footer">
